# Xcode-Projekt wird mit XcodeGen erzeugt:
#   brew install xcodegen
#   xcodegen generate
#   open KartographBlock.xcodeproj
name: KartographBlock
options:
  bundleIdPrefix: de.rab2385
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  KartographCore:
    path: KartographCore

targets:
  KartographBlock:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: KartographCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.rab2385.kartographblock
        PRODUCT_NAME: Kartograph
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kartograph
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown

schemes:
  KartographBlock:
    build:
      targets:
        KartographBlock: all
    test:
      targets:
        - package: KartographCore/KartographCoreTests
