name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: Wertungslogik testen
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: KartographCore
        run: swift test

  app-build:
    name: iPad-App bauen
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Projekt erzeugen
        run: xcodegen generate
      - name: Bauen (iOS Simulator, ohne Signatur)
        run: |
          xcodebuild build \
            -project KartographBlock.xcodeproj \
            -scheme KartographBlock \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
