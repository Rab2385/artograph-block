name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web-App testen und bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  core-tests:
    name: Wertungslogik testen
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: KartographCore
        run: swift test

  app-build:
    name: iPad-App bauen
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen installieren
        run: brew install xcodegen
      - name: Projekt erzeugen
        run: xcodegen generate
      - name: Bauen (iOS Simulator, ohne Signatur)
        run: |
          xcodebuild build \
            -project KartographBlock.xcodeproj \
            -scheme KartographBlock \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
